<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PrivacyShield — Reviewed meeting view</title>
    <link rel="stylesheet" href="present.css" />
  </head>
  <body>
    <header>
      <b>PRIVACYSHIELD / MEETING VIEW</b>
      <div>
        <button id="fullscreen">Fullscreen</button
        ><button id="clear-view">Clear content</button>
      </div>
    </header>
    <main>
      <p id="view-status" role="status">Preparing reviewed snapshot…</p>
      <pre id="shared-content"></pre>
    </main>
    <footer>
      Share this tab in your meeting. Only your reviewed text is shown. The
      original website, other tabs and desktop are not part of this snapshot.
    </footer>
    <script src="present.js"></script>
  </body>
</html>
